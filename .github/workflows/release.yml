name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web minification tools
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock encrypted sources
        run: |
          printf '%s' "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into firmware
        run: |
          sed -i 's/#define FIRMWARE_VERSION "dev"/#define FIRMWARE_VERSION "${{ steps.version.outputs.version }}"/' src/version.h
          sed -i '/#define DEV_BUILD/d' src/version.h
          echo "Firmware version set to: ${{ steps.version.outputs.version }}"
          cat src/version.h

      - name: Build firmware
        run: |
          pio run -e esp32dev
          pio run -e esp32s3

      - name: Build LittleFS image
        run: pio run -e esp32dev -t buildfs

      - name: Create web assets TAR for OTA
        run: |
          cd data
          # Create a tar archive of all web assets (for OTA web updates)
          tar cf ../web_assets.tar *
          cd ..
          echo "Web assets TAR created:"
          ls -lh web_assets.tar

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          # ESP32 firmware bundle
          cp .pio/build/esp32dev/firmware.bin release/firmware.bin
          cp .pio/build/esp32dev/bootloader.bin release/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin release/partitions.bin
          cp $HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/boot_app0.bin
          cp .pio/build/esp32dev/littlefs.bin release/littlefs.bin
          # ESP32-S3 firmware bundle
          cp .pio/build/esp32s3/firmware.bin release/firmware-esp32s3.bin
          cp .pio/build/esp32s3/bootloader.bin release/bootloader-esp32s3.bin
          cp .pio/build/esp32s3/partitions.bin release/partitions-esp32s3.bin
          cp $HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/boot_app0-esp32s3.bin
          cp .pio/build/esp32dev/littlefs.bin release/littlefs-esp32s3.bin
          # Web assets TAR for OTA updates
          cp web_assets.tar release/web_assets.tar
          echo "=== Release artifacts ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenChess ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/firmware.bin
            release/bootloader.bin
            release/partitions.bin
            release/boot_app0.bin
            release/littlefs.bin
            release/firmware-esp32s3.bin
            release/bootloader-esp32s3.bin
            release/partitions-esp32s3.bin
            release/boot_app0-esp32s3.bin
            release/littlefs-esp32s3.bin
            release/web_assets.tar
          body: |
            ## OpenChess ${{ github.ref_name }}

            ### Flash via Browser (ESP Web Tools)
            Use the [OpenChess Web Installer](https://joojoooo.github.io/OpenChess/flash.html) to flash your ESP32 directly from the browser.

            ### Release Files
            | File | Description |
            |------|-------------|
            | `firmware.bin` | Main application firmware |
            | `bootloader.bin` | ESP32 bootloader |
            | `partitions.bin` | Partition table |
            | `boot_app0.bin` | OTA boot selector |
            | `littlefs.bin` | Web UI filesystem image |
            | `web_assets.tar` | Web UI assets for OTA updates |

  # Deploy GitHub Pages with the new release firmware so the Web Installer can fetch
  # binaries from the same origin (GitHub Pages has CORS headers, GitHub Releases does not).
  deploy-pages:
    needs: build
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
